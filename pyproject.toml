[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-agent"
version = "0.1.0"
description = "AURA (Autonomous Utility & Runtime Assistant) — A personal terminal AI agent with controlled tool access to your system, Docker, git, and GitHub — free via local Ollama or OpenAI's API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu" }]
keywords = ["aura", "cli", "agent", "llm", "ollama", "openai", "docker", "github", "devops"]

dependencies = [
    "openai>=1.30.0",
    "psutil>=5.9.0",
    "docker>=7.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "PyGithub>=2.3.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
aura = "aura.cli:main"
myai = "aura.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]
